[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-verifier"
version = "0.1.0"
description = "Verificador de imagens duplicadas (idênticas e visuais) via terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Filipi Maciel" }]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "ImageHash>=4.3.1",
    "tqdm>=4.66.0",
    "Send2Trash>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
dupcheck = "duplicate_verifier.cli:main"
dupcheck-gui = "duplicate_verifier.gui:run_app_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
